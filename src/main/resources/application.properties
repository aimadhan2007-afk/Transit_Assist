# ========================================================
# TransitAssist Application Configuration
# ========================================================
spring.application.name=TransitAssist
server.port=8080

# ========================================================
# Database Configuration (MySQL)
# ========================================================

# ========================================================
# MySQL Database Configuration (Used when active profile is default/mysql)
# ========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/transitassist?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Madhanm@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================================
# JPA / Hibernate Configuration
# ========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ========================================================
# Thymeleaf Configuration
# ========================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
