<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Helper Management')}"></head>
<body>

  <nav th:replace="~{fragments/navbar :: navbar}"></nav>

  <main class="main-content">
    <div class="container">

      <div th:replace="~{fragments/alerts :: alerts}"></div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem; flex-wrap: wrap; gap: 1rem;">
        <div>
          <h2>Campus Transit Helpers</h2>
          <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem;">
            Manage campus assistants, contact details, specializations, and real-time availability.
          </p>
        </div>
        <button type="button" class="btn btn-primary" onclick="openModal('addHelperModal')">
          <span>➕</span> Add New Helper
        </button>
      </div>

      <!-- Helpers Table Card -->
      <div class="card" style="padding: 0; overflow: hidden;">
        <div class="table-responsive" style="border: none;">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Helper Name</th>
                <th>Phone Number</th>
                <th>Specialization</th>
                <th>Availability</th>
                <th>Change Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="h : ${helpers}">
                <td style="font-weight: 700;">#<span th:text="${h.id}">1</span></td>
                <td>
                  <span style="font-weight: 600; font-size: 1rem;" th:text="${h.name}">John</span>
                </td>
                <td th:text="${h.phone}">9876543211</td>
                <td>
                  <span th:text="${h.specialization}">Wheelchair Assistance</span>
                </td>
                <td>
                  <span th:if="${h.availability.name() == 'AVAILABLE'}" class="badge badge-available">AVAILABLE</span>
                  <span th:if="${h.availability.name() == 'BUSY'}" class="badge badge-busy">BUSY</span>
                  <span th:if="${h.availability.name() == 'OFFLINE'}" class="badge badge-offline">OFFLINE</span>
                </td>
                <td>
                  <form th:action="@{'/staff/helpers/' + ${h.id} + '/availability'}" method="post" style="display: inline-flex; gap: 0.35rem;">
                    <select name="availability" class="form-select form-select-sm" style="width: auto; padding: 0.25rem 0.5rem; font-size: 0.8rem;" onchange="this.form.submit()">
                      <option th:each="avail : ${availabilities}" 
                              th:value="${avail.name()}" 
                              th:text="${avail.name()}" 
                              th:selected="${h.availability.name() == avail.name()}">AVAILABLE</option>
                    </select>
                  </form>
                </td>
                <td>
                  <div style="display: flex; gap: 0.4rem;">
                    <form th:action="@{'/staff/helpers/' + ${h.id} + '/delete'}" method="post"
                          onsubmit="return confirm('Are you sure you want to remove this helper? This cannot be undone.');">
                      <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Add Helper Modal -->
  <div id="addHelperModal" class="modal-overlay">
    <div class="modal-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem;">
        <h3>Add New Campus Helper</h3>
        <button type="button" class="btn btn-secondary btn-sm" onclick="closeModal('addHelperModal')">✕</button>
      </div>

      <form th:action="@{/staff/helpers}" th:object="${helperDTO}" method="post">
        <div class="form-group">
          <label for="name" class="form-label">Full Name *</label>
          <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="e.g. John Doe" required>
        </div>

        <div class="form-group">
          <label for="phone" class="form-label">Phone Number *</label>
          <input type="tel" id="phone" th:field="*{phone}" class="form-control" placeholder="e.g. 9876543211" required>
        </div>

        <div class="form-group">
          <label for="specialization" class="form-label">Specialization / Expertise</label>
          <input type="text" id="specialization" th:field="*{specialization}" class="form-control" 
                 placeholder="e.g. Wheelchair Assistance, Escort Support, Sign Language">
        </div>

        <div class="form-group">
          <label for="availability" class="form-label">Initial Availability</label>
          <select id="availability" th:field="*{availability}" class="form-select">
            <option th:each="avail : ${availabilities}" 
                    th:value="${avail.name()}" 
                    th:text="${avail.name()}">AVAILABLE</option>
          </select>
        </div>

        <div style="display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeModal('addHelperModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Helper</button>
        </div>
      </form>
    </div>
  </div>

  <footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
