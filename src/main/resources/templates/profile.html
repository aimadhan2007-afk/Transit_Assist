<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('My Profile')}"></head>
<body>

  <nav th:replace="~{fragments/navbar :: navbar}"></nav>

  <main class="main-content">
    <div class="container" style="max-width: 620px;">

      <div class="card glass-panel card-padded" style="border-top: 4px solid var(--primary); box-shadow: var(--shadow-md);">
        <div style="display: flex; align-items: center; gap: 1.25rem; margin-bottom: 2rem; flex-wrap: wrap;">
          <div style="width: 4.5rem; height: 4.5rem; border-radius: var(--radius-full); background: var(--primary-gradient); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: 0 4px 14px var(--primary-glow);">
            👤
          </div>
          <div>
            <h2 th:text="${currentUser.fullName}">User Full Name</h2>
            <div style="margin-top: 0.35rem; display: flex; gap: 0.5rem; align-items: center;">
              <span th:if="${currentUser.role.name() == 'ADMIN'}" class="role-tag role-admin">ADMINISTRATOR</span>
              <span th:if="${currentUser.role.name() == 'STAFF'}" class="role-tag role-staff">STAFF MEMBER</span>
              <span th:if="${currentUser.role.name() == 'USER'}" class="role-tag role-user">CAMPUS USER</span>
            </div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 1rem;">
          <div style="padding: 1.15rem; background-color: var(--bg-surface-elevated); border-radius: var(--radius-md); border: 1px solid var(--border-medium);">
            <div style="font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Email Address</div>
            <div style="font-size: 1.05rem; font-weight: 600; margin-top: 0.25rem;" th:text="${currentUser.email}">user@example.com</div>
          </div>

          <div style="padding: 1.15rem; background-color: var(--bg-surface-elevated); border-radius: var(--radius-md); border: 1px solid var(--border-medium);">
            <div style="font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Contact Phone</div>
            <div style="font-size: 1.05rem; font-weight: 600; margin-top: 0.25rem;" th:text="${currentUser.phone}">9876543210</div>
          </div>

          <div style="padding: 1.15rem; background-color: var(--bg-surface-elevated); border-radius: var(--radius-md); border: 1px solid var(--border-medium);">
            <div style="font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Account Status</div>
            <div style="margin-top: 0.35rem;">
              <span th:if="${currentUser.enabled}" class="badge badge-completed">
                <span class="badge-dot"></span> ACTIVE & VERIFIED
              </span>
              <span th:if="${!currentUser.enabled}" class="badge badge-cancelled">
                <span class="badge-dot"></span> DISABLED
              </span>
            </div>
          </div>

          <div style="padding: 1.15rem; background-color: var(--bg-surface-elevated); border-radius: var(--radius-md); border: 1px solid var(--border-medium);">
            <div style="font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Campus Member Since</div>
            <div style="font-size: 1.05rem; font-weight: 600; margin-top: 0.25rem;" 
                 th:text="${#temporals.format(currentUser.createdAt, 'dd MMMM yyyy')}">28 September 2026</div>
          </div>
        </div>

        <div style="margin-top: 2rem; display: flex; gap: 0.75rem; flex-wrap: wrap;">
          <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="btn btn-primary">Return to Admin Center</a>
          <a sec:authorize="hasRole('STAFF')" th:href="@{/staff/dashboard}" class="btn btn-primary">Return to Staff Portal</a>
          <a sec:authorize="hasRole('USER')" th:href="@{/dashboard}" class="btn btn-primary">Return to My Dashboard</a>
          <a th:href="@{/}" class="btn btn-secondary">Home</a>
        </div>
      </div>

    </div>
  </main>

  <footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
