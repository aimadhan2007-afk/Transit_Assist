<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Sign In')}"></head>
<body>

  <nav th:replace="~{fragments/navbar :: navbar}"></nav>

  <main class="main-content">
    <div class="container" style="max-width: 500px;">

      <div th:replace="~{fragments/alerts :: alerts}"></div>

      <div class="card glass-panel" style="padding: 2.5rem; position: relative; overflow: hidden; border-top: 4px solid var(--primary);">
        
        <div style="text-align: center; margin-bottom: 2rem;">
          <div class="brand-logo" style="margin: 0 auto 1.25rem; width: 3.5rem; height: 3.5rem; border-radius: var(--radius-md);">
            <svg class="icon-svg" style="width: 1.8rem; height: 1.8rem;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="4.5" r="2.5"></circle>
              <path d="M12 7v5l3 3"></path>
              <path d="M7 13a5 5 0 1 0 5 5"></path>
              <path d="M15 15h4l2 4"></path>
            </svg>
          </div>
          <h2>Welcome Back</h2>
          <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.35rem;">
            Sign in to access your transit assistance portal
          </p>
        </div>

        <form th:action="@{/login}" method="post">
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
            <span>Sign In</span>
            <svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
          </button>
        </form>

        <!-- Quick Demo Account Switcher -->
        <div style="margin-top: 2rem; padding: 1.25rem; background: var(--bg-surface-elevated); border-radius: var(--radius-md); border: 1px solid var(--border-medium);">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem;">
            <span style="font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em;">
              ⚡ Quick Demo Personas (Click to Fill)
            </span>
          </div>

          <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <button type="button" class="btn btn-secondary btn-sm" style="justify-content: space-between; text-align: left;"
                    onclick="fillCredentials('admin@transitassist.com', 'Admin@123')">
              <span>👑 <strong>ADMIN:</strong> admin@transitassist.com</span>
              <span class="role-badge badge-admin">Admin@123</span>
            </button>

            <button type="button" class="btn btn-secondary btn-sm" style="justify-content: space-between; text-align: left;"
                    onclick="fillCredentials('staff@transitassist.com', 'Staff@123')">
              <span>👔 <strong>STAFF:</strong> staff@transitassist.com</span>
              <span class="role-badge badge-staff">Staff@123</span>
            </button>

            <button type="button" class="btn btn-secondary btn-sm" style="justify-content: space-between; text-align: left;"
                    onclick="fillCredentials('madhan@example.com', 'Password@123')">
              <span>👤 <strong>USER:</strong> madhan@example.com</span>
              <span class="role-badge badge-user">Password@123</span>
            </button>
          </div>
        </div>

        <div style="text-align: center; margin-top: 1.75rem; font-size: 0.925rem; color: var(--text-secondary);">
          Need an account? <a th:href="@{/register}" style="font-weight: 700;">Register as a campus member →</a>
        </div>

      </div>

    </div>
  </main>

  <footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
