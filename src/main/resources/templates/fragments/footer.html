<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

  <footer th:fragment="footer" class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <span class="footer-logo">♿ Transit<span class="gradient-text">Assist</span></span>
        <p class="footer-tagline">Accessible, dignified, and synchronized campus transit assistance.</p>
      </div>
      <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
        <span style="font-size: 0.8rem; display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.25rem 0.65rem; background: var(--bg-surface-elevated); border: 1px solid var(--border-medium); border-radius: var(--radius-full);">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #10b981; display: inline-block;"></span>
          <span style="font-weight: 600; color: var(--text-secondary);">Campus Transit Network Active</span>
        </span>
      </div>
      <div class="footer-bottom">
        <p>© 2026 TransitAssist. Built with WCAG accessibility best practices.</p>
      </div>
    </div>
  </footer>

</body>
</html>
