<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

  <nav th:fragment="navbar" class="navbar" aria-label="Main Navigation">
    <div class="container navbar-inner">
      <a th:href="@{/}" class="brand" aria-label="TransitAssist Home">
        <div class="brand-logo">
          <!-- Accessibility Transit SVG Icon -->
          <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="4.5" r="2.5"></circle>
            <path d="M12 7v5l3 3"></path>
            <path d="M7 13a5 5 0 1 0 5 5"></path>
            <path d="M15 15h4l2 4"></path>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">Transit<span class="gradient-text">Assist</span></span>
          <span class="brand-badge">Accessible Campus</span>
        </div>
      </a>

      <!-- Mobile Navigation Hamburger Button -->
      <button class="mobile-toggle" aria-label="Toggle navigation menu" onclick="toggleMobileMenu()">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <!-- Authenticated Navigation Links -->
      <ul class="nav-links" id="primaryNavLinks" sec:authorize="isAuthenticated()">
        <!-- User Links -->
        <li sec:authorize="hasRole('USER')">
          <a th:href="@{/dashboard}" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>Dashboard</span>
          </a>
        </li>
        <li sec:authorize="hasRole('USER')">
          <a th:href="@{/requests/new}" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
            <span>Book Trip</span>
          </a>
        </li>
        <li sec:authorize="hasRole('USER')">
          <a th:href="@{/requests/my}" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <span>My Bookings</span>
          </a>
        </li>

        <!-- Staff Links -->
        <li sec:authorize="hasRole('STAFF')">
          <a th:href="@{/staff/dashboard}" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            <span>Staff Portal</span>
          </a>
        </li>

        <!-- Admin Links -->
        <li sec:authorize="hasRole('ADMIN')">
          <a th:href="@{/admin/dashboard}" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
            <span>Admin Center</span>
          </a>
        </li>

        <!-- Staff & Admin Shared Links -->
        <li sec:authorize="hasAnyRole('STAFF', 'ADMIN')">
          <a th:href="@{/staff/requests}" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
            <span>All Requests</span>
          </a>
        </li>
        <li sec:authorize="hasAnyRole('STAFF', 'ADMIN')">
          <a th:href="@{/staff/helpers}" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            <span>Helpers</span>
          </a>
        </li>
        <li sec:authorize="hasAnyRole('STAFF', 'ADMIN')">
          <a th:href="@{/staff/helpers/workload}" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            <span>Workload</span>
          </a>
        </li>

        <!-- Admin Only Users Governance -->
        <li sec:authorize="hasRole('ADMIN')">
          <a th:href="@{/admin/users}" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
            <span>Users</span>
          </a>
        </li>

        <li>
          <a th:href="@{/profile}" class="nav-link">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span>Profile</span>
          </a>
        </li>
      </ul>

      <!-- Public Navigation Links -->
      <ul class="nav-links" id="publicNavLinks" sec:authorize="!isAuthenticated()">
        <li><a th:href="@{/}" class="nav-link">Home</a></li>
        <li><a th:href="@{/login}" class="nav-link">Login</a></li>
        <li><a th:href="@{/register}" class="btn btn-primary btn-sm glow-button">Get Started</a></li>
      </ul>

      <div class="nav-actions">
        <!-- Modern Theme Toggle Pill -->
        <button class="theme-toggle-btn" aria-label="Toggle light or dark theme" title="Toggle theme">
          <span class="theme-icon sun-icon">☀️</span>
          <span class="theme-icon moon-icon">🌙</span>
        </button>

        <!-- User Role Indicator & Logout -->
        <div sec:authorize="isAuthenticated()" class="user-action-group">
          <div class="user-pill-card">
            <span class="user-name" sec:authentication="name">User</span>
            <span sec:authorize="hasRole('ADMIN')" class="role-badge badge-admin">ADMIN</span>
            <span sec:authorize="hasRole('STAFF')" class="role-badge badge-staff">STAFF</span>
            <span sec:authorize="hasRole('USER')" class="role-badge badge-user">USER</span>
          </div>

          <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="btn btn-outline btn-sm logout-btn" title="Sign out of TransitAssist">
              <svg class="icon-svg-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
              <span>Logout</span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </nav>

</body>
</html>
